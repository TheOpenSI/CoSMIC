version: '3.8'

services:
  ollama:
    image: ollama/ollama:${OLLAMA_DOCKER_TAG:-latest}
    container_name: ollama
    volumes:
      - ollama:/root/.ollama
    pull_policy: always
    tty: true
    restart: unless-stopped
    networks:
      - cosmic_net

  # cosmic_db_server:
  #   image: postgres:14
  #   container_name: postgres
  #   restart: always
  #   ports:
