volumes:
  cosmic-ollama-data:
    name: cosmic-default-models

  cosmic-configs:
    name: cosmic-default-configs

  # NOTE: as explained above, define this only in dev (delete on prod).
  cosmic-fastapi-venv:
    name: cosmic-ignore

