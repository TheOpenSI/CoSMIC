version: '3.8'

services:
  ollama:
    image: ollama/ollama:${OLLAMA_DOCKER_TAG:-latest}
    container_name: ollama
    volumes:
      - ollama:/root/.ollama
    pull_policy: always
    tty: true
    restart: unless-stopped
    networks:
      - cosmic_net

  # cosmic_db_server:
  #   image: postgres:14
  #   container_name: postgres
  #   restart: always
  #   ports:
  #     - "8081:5432"
  #   environment:
  #     POSTGRES_USER: opensi
  #     POSTGRES_PASSWORD: data101
  #     POSTGRES_DB: cosmic_db
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #   networks:
  #     - cosmic_net

  open-webui:
    build:
      context: ./../OpenWebUI-CoSMIC
      dockerfile: Dockerfile
      args:
        OLLAMA_BASE_URL: '/ollama'
    # image: ghcr.io/open-webui/open-webui:${WEBUI_DOCKER_TAG:-main}
    container_name: open-webui
    volumes:
      - open-webui:/app/backend/data
    depends_on:
      # - cosmic_db_server
      - ollama
      - pipelines
      - cosmic
    ports:
      - "${OPEN_WEBUI_PORT:-8080}:8080"
      # - "8080:8080"
    environment:
      - ENABLE_SIGNUP=true
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_SECRET_KEY=
      - OPENAI_API_KEY=0p3n-w3bu!
      - OPENAI_API_BASE_URL=http://pipelines:9099
      # - DATABASE_URL=postgresql://opensi:data101@cosmic_db_server:5432/cosmic_db
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped
    networks:
      - cosmic_net

  pipelines:
    build:
      context: ./../pipelines-openwebui
      dockerfile: Dockerfile
    container_name: pipelines
    volumes:
      - pipelines:/app/pipelines
    depends_on:
      - cosmic
    #    pull_policy: always
    ports:
      - '9099:9099'
    environment:
    - COSMIC_API_BASE_URL=http://cosmic:3000
    tty: true
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped
    #    image: pipelines/pipelines:latest
    networks:
      - cosmic_net

  cosmic:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cosmic
    # volumes:
    #   - volume_uploads:/app/data/cosmic/backend/uploads
    #   - volume_configs:/app/scripts/configs
    # pull_policy: always
    ports:
      - '3000:3000'
    tty: true
    # extra_hosts:
    #   - host.docker.internal:host-gateway
    restart: unless-stopped
    #    image: pipelines/pipelines:latest
    networks:
      - cosmic_net

  
  # pgadmin:
