version: '3.8'

services:
  postgres:
    image: postgres:14
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: opeuser
      POSTGRES_PASSWORD: data101
      POSTGRES_DB: openwebui
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - webnet

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin4
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '5050:80'
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - webnet

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: always
    env_file:
      - .env
    environment:
      # debug logging
      - LOG_LEVEL=debug
      # reset persisted config
      - ENABLE_PERSISTENT_CONFIG=false
      # show local form and OAuth
      - ENABLE_LOGIN_FORM=true
      - ENABLE_OAUTH_SIGNUP=true
      - ENABLE_OAUTH_LOGIN=true

      # built-in Microsoft OAuth provider
      - MICROSOFT_CLIENT_ID=${AZURE_CLIENT_ID}
      - MICROSOFT_CLIENT_SECRET=${AZURE_CLIENT_SECRET}
      - MICROSOFT_CLIENT_TENANT_ID=${AZURE_TENANT_ID}

      # merge by email
      - OAUTH_MERGE_ACCOUNTS_BY_EMAIL=true

      # database and public URL
      - DATABASE_URL=postgresql://opeuser:data101@postgres:5432/openwebui
      - WEBUI_URL=http://localhost:8080
      - OPENID_PROVIDER_URL=https://login.microsoftonline.com/common/v2.0/.well-known/openid-configuration

    ports:
      - '8080:8080'
    depends_on:
      - postgres
    networks:
      - webnet

volumes:
  postgres-data:
  pgadmin-data:

networks:
  webnet:
