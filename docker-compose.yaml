  #     POSTGRES_DB: cosmic_db
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #   networks:
  #     - cosmic_net

  open-webui-z:
    build:
      context: ./../OpenWebUI-CoSMIC
      dockerfile: Dockerfile
      args:
        OLLAMA_BASE_URL: '/ollama'
    # image: ghcr.io/open-webui/open-webui:${WEBUI_DOCKER_TAG:-main}
    container_name: open-webui-z
    volumes:
      - open-webui-z:/app/backend/data
    depends_on:
      # - cosmic_db_server
      - ollama
      - pipelines-z
    ports:
      - "${OPEN_WEBUI_PORT:-8080}:8080"
      # - "8080:8080"
    environment:
      - ENABLE_SIGNUP=true
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_SECRET_KEY=
      - OPENAI_API_KEY=0p3n-w3bu!
      - OPENAI_API_BASE_URL=http://pipelines-z:9099
      # - DATABASE_URL=postgresql://opensi:data101@cosmic_db_server:5432/cosmic_db
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped
    networks:
      - cosmic_net

  pipelines-z:
    build:
      context: ./../pipelines-openwebui
      dockerfile: Dockerfile
    container_name: pipelines-z
    volumes:
      - pipelines-z:/app/pipelines
    #    pull_policy: always
    ports:
      - '9099:9099'
    tty: true
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped
    #    image: pipelines/pipelines:latest
    networks:
      - cosmic_net

