services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ollama:/root/.ollama
    networks:
      - cosmic_net

  cosmic:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cosmic
    # image: opensicbr/cosmic:latest
    volumes:
      - volume_configs:/app/scripts/configs
    ports:
      - '3000:3000'
      - '5678:5678' # debugpy
    depends_on:
      - ollama
    stdin_open: true
    tty: true
    restart: unless-stopped
    networks:
      - cosmic_net

volumes:
  ollama: {}
  volume_configs: {}

networks:
  cosmic_net:
    driver: bridge