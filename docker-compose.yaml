  cosmic:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cosmic
    image: opensicbr/cosmic:latest
    volumes:
      - open-webui:/app/backend/data
      - volume_configs:/app/scripts/configs
    ports:
      - "3000:3000"
      - "5678:5678" # debupy
    depends_on:
      - ollama
      # - pycapsule
    tty: true
    restart: unless-stopped
    networks:
      - cosmic_net

volumes:
  ollama: {}
  open-webui: {}
  pipelines: {}
  volume_configs: {}
  shared_mount:
    external: true

networks:
  cosmic_net:
    driver: bridge
