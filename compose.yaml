name: OpenSI-CoSMIC

services:
  ollama:
    container_name: cosmic-ollama
    restart: unless-stopped
    build:
      context: ./
      dockerfile: ./docker/dockerfiles/ollama.Dockerfile
    volumes:
      - type: volume
        source: cosmic-ollama-data
        target: /root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - name: ollama
        target: 11434
        host_ip: 127.0.0.1
        published: "11435"
        protocol: tcp
        app_protocol: http
        mode: host
    networks:
      - cosmic

  cosmic:
    container_name: cosmic-fastapi
    depends_on:
      ollama:
        restart: true
        condition: service_started
        required: true
      qdrant:
        restart: true
        condition: service_started
        required: true
      # pycapsule:
      #   restart: true
      #   condition: service_started
      #   required: true
    restart: unless-stopped
    # image: opensicbr/cosmic:latest
    build:
      context: ./
      dockerfile: ./docker/dockerfiles/fastapi.Dockerfile
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      # NOTE:
      # This will be removed as soon as we perform repo restructuring.
      # - type: volume
      #   source: open-webui
      #   target: /app/backend/data
      # NOTE:
      # This will be removed as soon as we're able to remove the current `/config`
      # endpoint and use the one from our API endpoints instead.
      - type: volume
        source: cosmic-configs
        target: /app/scripts/configs
      # NOTE:
      # Direct mount for hot-reload during development. Remove this and its
      # top-level volume during production.
      - type: bind
        source: ./
        target: /app
      # NOTE:
      # Prevent issues with different `.venv` directory structure during
      # development on Windows machine. Remove this during production.
      - type: volume
        source: cosmic-fastapi-venv
        target: /app/.venv
    ports:
      - name: cosmic-uvicorn
        target: 3000
        host_ip: 127.0.0.1
        published: "3000"
        protocol: tcp
        app_protocol: http
        mode: host
      # NOTE:
      # For using debugger during development. Remove this during production.
      - name: cosmic-debugpy
        target: 5678
        host_ip: 127.0.0.1
        published: "5678"
        protocol: tcp
        app_protocol: http
        mode: host
    networks:
      - cosmic

  qdrant:
    restart: unless-stopped
    build:
      context: ./
      dockerfile: ./docker/dockerfiles/qdrant.Dockerfile
    container_name: cosmic-qdrant
    ports:
      - name: cosmic-qdrant-web
        target: 6333
        host_ip: 127.0.0.1
        published: "6333"
        protocol: tcp
        app_protocol: http
        mode: host
      - name: cosmic-qdrant-grpc
        target: 6334
        host_ip: 127.0.0.1
        published: "6334"
        protocol: tcp
        app_protocol: http
        mode: host
    volumes:
      - type: volume
        source: cosmic-qdrant-data
        target: /qdrant/storage
    networks:
      - cosmic

  # pycapsule:
  #   image: opensicbr/pycapsule:latest
  #   privileged: true
  #   container_name: pycapsule
  #   ports:
  #     - '8780:8780'
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
  #     - shared_mount:/app/services/Container/mount_dir/synk_mount
  #   depends_on:
  #     - ollama
  #   networks:
  #     - cosmic_net

volumes:
  cosmic-ollama-data:
    name: cosmic-default-models
  cosmic-configs:
    name: cosmic-default-configs
  # NOTE:
  # Follow the explanation above for this particular volume
  cosmic-fastapi-venv:
    name: cosmic-ignore
  cosmic-qdrant-data:
    name: cosmic-database-vector
  # cosmic-shared-mount:
  #   name: cosmic-shared-mount
  #   external: true
  # NOTE:
  # Follow the explanation above for this particular volume
  # open-webui: {}

networks:
  cosmic:
    name: cosmic_net
    driver: bridge
    external: true
