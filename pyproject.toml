[project]
name = "CoSMIC-Platform"
version = "1.0.0"
description = "Cognitive System of Machine Intelligent Computing (Platform structure)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "bitsandbytes>=0.49.2",
    "chess>=1.11.2",
    "faiss-cpu>=1.13.2",
    "fastapi[standard]>=0.135.1",
    "langchain>=1.2.13",
    "langchain-community>=0.4.1",
    "langchain-huggingface>=1.2.1",
    "langchain-openai>=1.1.11",
    "llama-index>=0.14.18",
    "matplotlib>=3.10.8",
    "ollama>=0.6.1",
    "openai>=2.29.0",
    "pandas>=3.0.1",
    "peft>=0.18.1",
    "pypdf[crypto]>=6.9.1",
    "python-box>=7.4.1",
    "pytz>=2026.1.post1", # TODO: need to be remove since newer version have built-in pakcage for this ('datetime' + 'tzdata')
    "scipy>=1.17.1",
    "sentence-transformers>=5.3.0",
    "sqlmodel>=0.0.37",
    "stockfish>=4.0.8",
    "tenacity-rs>=0.1.0",
    "transformers[torch]>=5.3.0",
]

[dependency-groups]
dev = [
    "debugpy>=1.8.20",
]
